<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f6b58">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ตรวจ 5ส">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>ตรวจ 5ส Production 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Prompt:wght@500;600&display=swap">
<style>
/* Layout: phone-first single column; sticky progress header while auditing; big 1–5 tap targets per checklist item */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --ink:#18221f; --muted:#5d6b66; --line:#dbe2df;
  --accent:#0f6b58; --accent-ink:#ffffff; --accent-soft:#dcefe9;
  --s1:#c2412d; --s2:#d9822b; --s3:#c9a227; --s4:#4f9a5a; --s5:#1f7a4d;
  --font-display:"Prompt","IBM Plex Sans Thai",system-ui,sans-serif;
  --font-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111715; --surface:#1a2320; --ink:#e6ece9; --muted:#9aaba4; --line:#2c3833;
  --accent:#4cc3a3; --accent-ink:#06201a; --accent-soft:#1f3a33;
  --s1:#ec6a55; --s2:#eea052; --s3:#e0c052; --s4:#7cc487; --s5:#4fc08a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111715; --surface:#1a2320; --ink:#e6ece9; --muted:#9aaba4; --line:#2c3833;
  --accent:#4cc3a3; --accent-ink:#06201a; --accent-soft:#1f3a33;
  --s1:#ec6a55; --s2:#eea052; --s3:#e0c052; --s4:#7cc487; --s5:#4fc08a; color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:0 96px}
.wrap{max-width:640px;margin:0 auto}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;font-weight:600}
h1{font-size:1.45rem}
h2{font-size:1.05rem}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.num{font-variant-numeric:tabular-nums}
header.top{padding-block:20px 12px;display:flex;flex-direction:column;gap:4px}
.eyebrow{font-size:.78rem;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.section-title{display:flex;justify-content:space-between;align-items:baseline;margin-block:20px 10px;gap:8px}
.areas{display:grid;gap:8px}
.area{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;width:100%}
.area:active{background:var(--accent-soft)}
.code{font-family:var(--font-display);font-weight:600;background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:6px 8px;font-size:.9rem;white-space:nowrap}
.area .name{min-width:0;font-size:.92rem;line-height:1.35}
.area .last{text-align:right;font-size:.8rem;color:var(--muted);white-space:nowrap}
.area .last b{display:block;font-size:1rem;color:var(--ink)}
.pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:.75rem;font-weight:600}
.draft{background:var(--accent);color:var(--accent-ink)}
.hist{display:grid;gap:6px}
.hrow{display:grid;grid-template-columns:1fr auto;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;width:100%}
.hrow .pct{font-family:var(--font-display);font-size:1.1rem}
.empty{border:1px dashed var(--line);border-radius:10px;padding:16px;color:var(--muted);font-size:.9rem}
/* audit view */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;margin-inline:-16px;padding-inline:16px;border-bottom:1px solid var(--line)}
.barrow{display:flex;align-items:center;gap:10px}
.back{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px}
.bar .title{flex:1;min-width:0}
.bar .title div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.85rem;color:var(--muted)}
.score{font-family:var(--font-display);font-size:1.25rem;text-align:right;line-height:1.1}
.score small{display:block;font-family:var(--font-body);font-size:.72rem;color:var(--muted)}
.prog{height:6px;border-radius:3px;background:var(--line);margin-top:8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-block:14px}
.meta label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted)}
.meta .full{grid-column:1/-1}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.scope{margin-block:18px 8px;font-size:.8rem;letter-spacing:.05em;color:var(--accent);font-weight:600}
.item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;margin-bottom:10px}
.item.done{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.ihead{display:flex;gap:10px;align-items:flex-start}
.ino{font-family:var(--font-display);color:var(--muted);min-width:1.6em}
.itopic{flex:1;min-width:0;font-weight:600;line-height:1.35}
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.lv{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;line-height:1.1;min-height:54px;justify-content:center}
.lv b{font-family:var(--font-display);font-size:1.3rem}
.lv span{font-size:.66rem;color:var(--muted);margin-top:2px}
.lv[aria-pressed="true"]{color:#fff;border-color:transparent}
.lv[aria-pressed="true"] span{color:inherit;opacity:.9}
.lv[data-v="1"][aria-pressed="true"]{background:var(--s1)}
.lv[data-v="2"][aria-pressed="true"]{background:var(--s2)}
.lv[data-v="3"][aria-pressed="true"]{background:var(--s3);color:#1b1a10}
.lv[data-v="4"][aria-pressed="true"]{background:var(--s4)}
.lv[data-v="5"][aria-pressed="true"]{background:var(--s5)}
.crit{font-size:.88rem;color:var(--muted);background:var(--bg);border-radius:8px;padding:8px 10px}
.crit b{color:var(--ink)}
.row2{display:flex;gap:8px;flex-wrap:wrap}
.link{background:none;border:none;color:var(--accent);padding:0;font-size:.85rem;text-decoration:underline;text-underline-offset:3px}
.critall{display:grid;gap:4px;font-size:.84rem}
.critall div{display:grid;grid-template-columns:auto 1fr;gap:8px;padding:6px 8px;border-radius:8px}
.critall div.on{background:var(--accent-soft)}
.critall em{font-style:normal;font-weight:600;color:var(--accent);white-space:nowrap}
.note{font-size:.9rem;min-height:40px;resize:vertical}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:6}
.foot .wrap{display:flex;gap:10px;align-items:center}
.btn{border:none;border-radius:12px;padding:12px 18px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--s1);color:#fff}
.grow{flex:1}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;z-index:10;max-width:90vw}
/* result */
.sum{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px;margin-top:14px}
.big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.big b{font-family:var(--font-display);font-size:2.6rem;line-height:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--bg);border-radius:10px;padding:8px 10px}
.stats b{display:block;font-family:var(--font-display);font-size:1.1rem}
.dist{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line)}
.dist i{display:block;height:100%}
.fix{display:grid;gap:8px}
.fix div{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:.9rem}
.chip{font-family:var(--font-display);color:#fff;border-radius:6px;padding:0 8px;font-weight:600}
pre.copytext{white-space:pre-wrap;font-size:.8rem;background:var(--bg);border-radius:8px;padding:10px;max-height:220px;overflow:auto;margin:0}
.confirm{background:var(--accent-soft);border-radius:10px;padding:12px;display:grid;gap:8px}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}
</style></head><body>
<div class="wrap" id="app"></div>
<div class="foot" id="foot" hidden><div class="wrap" id="footin"></div></div>

<script>

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cleanName=n=>n.replace(/\s*\(PD-\d+\)\s*/g," ").replace(/\s*Line\.?\s*1\s*$/i,"").replace(/\s+,/g,",").trim();
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const thDate=s=>{if(!s)return"";const[y,m,d]=s.split("-").map(Number);const M=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];return d+" "+M[m-1]+" "+(y+543)};
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

function itemsOf(code){const a=DATA.areas.find(x=>x[0]===code);const out=[];a[2].forEach(([scope,ids])=>ids.forEach(i=>out.push({scope,row:DATA.lib[i]})));return {code:a[0],name:cleanName(a[1]),items:out}}
function calc(scores,n){const vals=scores.filter(v=>v>0);const total=vals.reduce((a,b)=>a+b,0);const full=n*5;return {done:vals.length,total,full,pct:full?Math.round(total*1000/full)/10:0,avg:vals.length?Math.round(total*10/vals.length)/10:0}}

let audits=store.get("audits")||[];
function saveAudits(){try{localStorage.setItem("audits",JSON.stringify(audits));return true}catch(e){return false}}
let view={name:"home"}, cur=null;

function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}

/* ---------- HOME ---------- */
function renderHome(){
  $("#foot").hidden=true;
  const lastBy={};audits.forEach(a=>{if(!lastBy[a.area]||a.date>lastBy[a.area].date)lastBy[a.area]=a});
  const draftKeys=DATA.areas.filter(a=>store.get("draft:"+a[0])).map(a=>a[0]);
  let h=`<header class="top"><div class="eyebrow">บริษัทไทยวา · Production 1</div><h1>ตรวจประเมิน 5ส</h1><div class="muted small">เลือกพื้นที่ แล้วกดให้คะแนน 1–5 ทีละข้อ ระบบรวมคะแนนและคิด % ให้ทันที</div></header>
  <div class="section-title"><h2>พื้นที่ตรวจ</h2><span class="muted small num">${DATA.areas.length} พื้นที่</span></div><div class="areas">`;
  DATA.areas.forEach(a=>{const code=a[0],n=a[2].reduce((s,x)=>s+x[1].length,0),L=lastBy[code];
    h+=`<button class="area" data-area="${code}"><span class="code">${code}</span><span class="name">${esc(cleanName(a[1]))}<br><span class="muted small">${n} ข้อ${draftKeys.includes(code)?' · <span class="pill draft">ร่างค้างอยู่</span>':''}</span></span><span class="last num">${L?`<b>${L.pct}%</b>${thDate(L.date)}`:'ยังไม่ตรวจ'}</span></button>`});
  h+=`</div><div class="section-title"><h2>ผลการตรวจในเครื่องนี้</h2>${audits.length?`<button class="btn ghost" id="csv">ส่งออก CSV</button>`:""}</div><div class="hist">`;
  if(!audits.length)h+=`<div class="empty">ยังไม่มีผลการตรวจ เมื่อกด “บันทึกผล” หลังตรวจเสร็จ ผลจะเก็บไว้ในมือถือเครื่องนี้และแสดงที่นี่ กดส่งออก CSV เพื่อเปิดใน Excel ได้</div>`;
  else audits.slice(0,40).forEach(a=>{h+=`<button class="hrow" data-open="${a.id}"><span><b>${a.area}</b> <span class="muted small">${thDate(a.date)} · ${esc(a.auditor||"-")} · ${esc(a.level||"")}</span></span><span class="pct num">${a.pct}%</span></button>`});
  h+=`</div>`;
  $("#app").innerHTML=h;
  $("#app").querySelectorAll("[data-area]").forEach(b=>b.onclick=()=>startAudit(b.dataset.area));
  const cb=$("#csv");if(cb)cb.onclick=exportCSV;
  $("#app").querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{const a=audits.find(x=>x.id===b.dataset.open);if(a)showResult(a)});
}

/* ---------- AUDIT ---------- */
function startAudit(code){
  const A=itemsOf(code);
  const d=store.get("draft:"+code);
  const prefs=store.get("prefs")||{};
  cur={code,A,scores:d?.scores||Array(A.items.length).fill(0),notes:d?.notes||Array(A.items.length).fill(""),date:d?.date||today(),auditor:d?.auditor??(prefs.auditor||""),level:d?.level||prefs.level||AUDIT_LEVELS[0],open:{}};
  view={name:"audit"};renderAudit();window.scrollTo(0,0);
}
function saveDraft(){if(!cur)return;store.set("draft:"+cur.code,{scores:cur.scores,notes:cur.notes,date:cur.date,auditor:cur.auditor,level:cur.level});store.set("prefs",{auditor:cur.auditor,level:cur.level})}
function renderAudit(){
  const {A}=cur;
  let h=`<div class="bar"><div class="barrow"><button class="back" id="back" aria-label="กลับ">‹ กลับ</button><div class="title"><b>${A.code}</b><div>${esc(A.name)}</div></div><div class="score num" id="sc"></div></div><div class="prog"><i id="pg"></i></div></div>
  <div class="meta"><label>วันที่ตรวจ<input type="date" id="f-date" value="${cur.date}"></label><label>ตรวจโดย<select id="f-level">${AUDIT_LEVELS.map(l=>`<option${l===cur.level?" selected":""}>${l}</option>`).join("")}</select></label><label class="full">ผู้ตรวจ<input id="f-auditor" placeholder="ชื่อผู้ตรวจ" value="${esc(cur.auditor)}"></label></div>`;
  let lastScope=null;
  A.items.forEach((it,i)=>{
    if(it.scope!==lastScope){h+=`<div class="scope">${esc(it.scope)}</div>`;lastScope=it.scope}
    h+=`<div class="item" id="it-${i}"><div class="ihead"><span class="ino num">${i+1}</span><span class="itopic">${esc(it.row[0])}</span></div><div class="levels" role="group" aria-label="คะแนนข้อ ${i+1}">${[1,2,3,4,5].map(v=>`<button class="lv" data-i="${i}" data-v="${v}" aria-pressed="false"><b>${v}</b><span>${LV_NAME[v-1]}</span></button>`).join("")}</div><div class="crit" id="cr-${i}"></div><div class="row2"><button class="link" data-all="${i}">ดูเกณฑ์ทั้ง 5 ระดับ</button><button class="link" data-note="${i}">เพิ่มหมายเหตุ</button></div><div class="critall" id="ca-${i}" hidden></div><textarea class="note" id="nt-${i}" placeholder="สิ่งที่พบ / ต้องแก้ไข" hidden>${esc(cur.notes[i])}</textarea></div>`;
  });
  $("#app").innerHTML=h;
  A.items.forEach((_,i)=>{paintItem(i);if(cur.notes[i])$("#nt-"+i).hidden=false});
  paintBar();
  $("#back").onclick=()=>{saveDraft();view={name:"home"};cur=null;renderHome();window.scrollTo(0,0)};
  $("#f-date").onchange=e=>{cur.date=e.target.value;saveDraft()};
  $("#f-level").onchange=e=>{cur.level=e.target.value;saveDraft()};
  $("#f-auditor").oninput=e=>{cur.auditor=e.target.value;saveDraft();paintFoot()};
  $("#app").querySelectorAll(".lv").forEach(b=>b.onclick=()=>{const i=+b.dataset.i,v=+b.dataset.v;cur.scores[i]=cur.scores[i]===v?0:v;paintItem(i);paintBar();saveDraft();
    if(cur.scores[i]){const nx=cur.scores.findIndex((s,k)=>k>i&&!s);if(nx>-1){const el=$("#it-"+nx);const r=el.getBoundingClientRect();if(r.top>window.innerHeight*0.75)window.scrollBy({top:r.top-window.innerHeight*0.35,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})}}});
  $("#app").querySelectorAll("[data-all]").forEach(b=>b.onclick=()=>{const i=+b.dataset.all;cur.open[i]=!cur.open[i];paintItem(i)});
  $("#app").querySelectorAll("[data-note]").forEach(b=>b.onclick=()=>{const t=$("#nt-"+b.dataset.note);t.hidden=false;t.focus()});
  $("#app").querySelectorAll(".note").forEach(t=>t.oninput=()=>{cur.notes[+t.id.slice(3)]=t.value;saveDraft()});
  $("#foot").hidden=false;paintFoot();
}
function paintItem(i){
  const row=cur.A.items[i].row,v=cur.scores[i];
  $("#it-"+i).querySelectorAll(".lv").forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.v===v)));
  $("#it-"+i).classList.toggle("done",v>0);
  $("#cr-"+i).innerHTML=v?`<b>ระดับ ${v} ${LV_NAME[v-1]}:</b> ${esc(row[v])}`:`แตะเลขระดับที่พื้นที่ทำได้ถึง · ระดับ 1: ${esc(row[1])}`;
  const ca=$("#ca-"+i);ca.hidden=!cur.open[i];
  if(cur.open[i])ca.innerHTML=[1,2,3,4,5].map(k=>`<div class="${k===v?"on":""}"><em>${k} ${LV_NAME[k-1]}</em><span>${esc(row[k])}</span></div>`).join("");
  $("#it-"+i).querySelector("[data-all]").textContent=cur.open[i]?"ซ่อนเกณฑ์":"ดูเกณฑ์ทั้ง 5 ระดับ";
}
function paintBar(){const c=calc(cur.scores,cur.A.items.length);$("#sc").innerHTML=`${c.pct}%<small>${c.total}/${c.full} · ตรวจ ${c.done}/${cur.A.items.length}</small>`;$("#pg").style.width=(c.done*100/cur.A.items.length)+"%";paintFoot()}
function paintFoot(){
  if(view.name!=="audit")return;
  const c=calc(cur.scores,cur.A.items.length),left=cur.A.items.length-c.done;
  $("#footin").innerHTML=`<div class="grow small muted">${left?`เหลืออีก ${left} ข้อ`:(cur.auditor.trim()?"ครบทุกข้อแล้ว":"ใส่ชื่อผู้ตรวจก่อนบันทึก")}</div><button class="btn" id="finish" ${left||!cur.auditor.trim()?"disabled":""}>ดูผล / บันทึก</button>`;
  $("#finish").onclick=finish;
}
async function finish(){
  const c=calc(cur.scores,cur.A.items.length);
  const rec={area:cur.code,areaName:cur.A.name,date:cur.date,auditor:cur.auditor.trim(),level:cur.level,scores:cur.scores.slice(),notes:cur.notes.slice(),total:c.total,full:c.full,pct:c.pct,avg:c.avg,createdAt:new Date().toISOString(),by:null};
  rec.id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  audits.unshift(rec);const saved=saveAudits();
  if(saved){store.del("draft:"+cur.code);toast("บันทึกผลแล้ว")}
  showResult(rec,!saved);
}

/* ---------- RESULT ---------- */
function summaryText(r,A){
  const lines=[`ผลตรวจ 5ส ${r.area} ${A.name}`,`วันที่ ${thDate(r.date)} · ผู้ตรวจ ${r.auditor} (${r.level})`,`คะแนน ${r.total}/${r.full} = ${r.pct}% · เฉลี่ยระดับ ${r.avg}`,""];
  const low=A.items.map((it,i)=>({it,i,v:r.scores[i]})).filter(x=>x.v<=2);
  if(low.length){lines.push("จุดที่ต้องปรับปรุง (ระดับ 1–2):");low.forEach(x=>lines.push(`- ข้อ ${x.i+1} ${x.it.row[0]}: ระดับ ${x.v}${r.notes[x.i]?" · "+r.notes[x.i]:""}`))}
  const other=A.items.map((it,i)=>({it,i})).filter(x=>r.scores[x.i]>2&&r.notes[x.i]);
  if(other.length){lines.push("","หมายเหตุอื่น:");other.forEach(x=>lines.push(`- ข้อ ${x.i+1} ${x.it.row[0]}: ${r.notes[x.i]}`))}
  return lines.join("\n");
}
function showResult(r,unsaved){
  view={name:"result",r};$("#foot").hidden=true;
  const A=itemsOf(r.area);const cnt=[0,0,0,0,0];r.scores.forEach(v=>{if(v)cnt[v-1]++});
  const low=A.items.map((it,i)=>({it,i,v:r.scores[i]})).filter(x=>x.v<=2);
  const txt=summaryText(r,A);
  let h=`<div class="bar"><div class="barrow"><button class="back" id="back">‹ หน้าหลัก</button><div class="title"><b>${r.area}</b><div>${esc(A.name)}</div></div></div></div>
  <div class="sum"><div class="muted small">${thDate(r.date)} · ${esc(r.auditor)} · ตรวจด้วย${esc(r.level)}</div>
  <div class="big"><b class="num">${r.pct}%</b><span class="muted num">${r.total} จาก ${r.full} คะแนน</span></div>
  <div class="dist" aria-label="สัดส่วนระดับ">${cnt.map((c,k)=>c?`<i style="width:${c*100/A.items.length}%;background:var(--s${k+1})" title="ระดับ ${k+1}: ${c} ข้อ"></i>`:"").join("")}</div>
  <div class="stats"><div><span class="muted small">เฉลี่ยระดับ</span><b class="num">${r.avg}</b></div><div><span class="muted small">จำนวนข้อ</span><b class="num">${A.items.length}</b></div><div><span class="muted small">ต้องปรับปรุง</span><b class="num">${low.length}</b></div></div>
  ${unsaved?`<div class="muted small">บันทึกลงเครื่องไม่สำเร็จ (อาจเปิดแบบไม่ระบุตัวตน) คัดลอกสรุปด้านล่างเก็บไว้ก่อน</div>`:""}</div>`;
  if(low.length){h+=`<div class="section-title"><h2>จุดที่ต้องปรับปรุง</h2></div><div class="sum fix">${low.map(x=>`<div><span class="chip" style="background:var(--s${x.v})">${x.v}</span><span><b>ข้อ ${x.i+1} ${esc(x.it.row[0])}</b>${r.notes[x.i]?`<br><span class="muted">${esc(r.notes[x.i])}</span>`:""}</span></div>`).join("")}</div>`}
  h+=`<div class="section-title"><h2>รายข้อ</h2></div><div class="sum fix">${A.items.map((it,i)=>`<div><span class="chip" style="background:var(--s${r.scores[i]||1})">${r.scores[i]||"-"}</span><span>${esc(it.row[0])}${r.notes[i]&&r.scores[i]>2?`<br><span class="muted small">${esc(r.notes[i])}</span>`:""}</span></div>`).join("")}</div>
  <div class="section-title"><h2>สรุปสำหรับส่งต่อ</h2><button class="btn ghost" id="copy">คัดลอก</button></div><pre class="copytext" id="ct">${esc(txt)}</pre>
  <div class="row2" style="margin-top:16px">${unsaved?`<button class="btn ghost" id="edit">กลับไปแก้คะแนน</button>`:""}${r.id?`<button class="btn ghost" id="del">ลบผลนี้</button>`:""}</div><div id="cf"></div>`;
  $("#app").innerHTML=h;window.scrollTo(0,0);
  $("#back").onclick=()=>{view={name:"home"};cur=null;renderHome();window.scrollTo(0,0)};
  $("#copy").onclick=()=>{navigator.clipboard?.writeText(txt).then(()=>toast("คัดลอกแล้ว"),()=>{const s=getSelection(),rg=document.createRange();rg.selectNodeContents($("#ct"));s.removeAllRanges();s.addRange(rg);toast("เลือกข้อความแล้ว กดคัดลอกเอง")})};
  const ed=$("#edit");if(ed)ed.onclick=()=>{view={name:"audit"};renderAudit()};
  const dl=$("#del");if(dl)dl.onclick=()=>{$("#cf").innerHTML=`<div class="confirm" style="margin-top:10px"><span>ลบผลตรวจ ${r.area} วันที่ ${thDate(r.date)} ถาวร?</span><div class="row2"><button class="btn danger" id="yes">ลบ</button><button class="btn ghost" id="no">ยกเลิก</button></div></div>`;
    $("#no").onclick=()=>$("#cf").innerHTML="";
    $("#yes").onclick=async()=>{try{audits=audits.filter(x=>x.id!==r.id);saveAudits();toast("ลบแล้ว");view={name:"home"};renderHome()}catch(e){toast("ลบไม่ได้ อาจไม่มีสิทธิ์")}}};
}

function exportCSV(){
  const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
  const rows=[["วันที่ตรวจ","พื้นที่","ชื่อพื้นที่","ผู้ตรวจ","ตรวจโดย","ข้อที่","หมวด","หัวข้อ","ระดับ","หมายเหตุ","คะแนนรวม","คะแนนเต็ม","%"]];
  audits.slice().reverse().forEach(r=>{const A=itemsOf(r.area);A.items.forEach((it,i)=>rows.push([r.date,r.area,A.name,r.auditor,r.level,i+1,it.scope,it.row[0],r.scores[i]||"",r.notes[i]||"",r.total,r.full,r.pct]))});
  const blob=new Blob(["\ufeff"+rows.map(r=>r.map(q).join(",")).join("\r\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="ผลตรวจ5ส_"+today()+".csv";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}
renderHome();
</script>
</body></html>
